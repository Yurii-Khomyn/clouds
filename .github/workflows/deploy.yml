name: Deploy

# push у main -> збірка образу -> публікація в реєстр з тегом = хеш коміту -> оновлення застосунку
on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write потрібен, щоб GitHub видав OIDC-токен. Інших прав workflow не має.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Вхід в Azure через OIDC. Секретів немає: лише публічні ідентифікатори зі змінних репозиторію.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          provenance: false
          tags: ${{ vars.ACR_LOGIN_SERVER }}/shop:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/shop:${{ github.sha }}"
